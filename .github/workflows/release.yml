name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each platform build lives in its own reusable workflow (also dispatchable
  # standalone), so the release build and the individual workflows cannot
  # drift apart. Each called workflow computes the version from pubspec.yaml
  # itself.
  build_apk:
    uses: ./.github/workflows/build_android_apk.yml
    secrets: inherit

  build_tar_x86_64:
    uses: ./.github/workflows/build_linux_tar_x64.yml

  build_tar_arm_64:
    uses: ./.github/workflows/build_linux_tar_arm64.yml

  build_deb_x86_64:
    uses: ./.github/workflows/build_linux_deb_x64.yml

  build_deb_arm_64:
    uses: ./.github/workflows/build_linux_deb_arm64.yml

  build_appimage_x86_64:
    uses: ./.github/workflows/build_linux_appimage_x64.yml

  build_appimage_arm_64:
    uses: ./.github/workflows/build_linux_appimage_arm64.yml

  build_macos_dmg:
    uses: ./.github/workflows/build_macos_dmg.yml

  build_windows_zip_x86_64:
    uses: ./.github/workflows/build_windows_zip_x64.yml
    secrets: inherit
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

  build_windows_zip_arm_64:
    uses: ./.github/workflows/build_windows_zip_arm64.yml
    secrets: inherit
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

  build_windows_exe_x86_64:
    uses: ./.github/workflows/build_windows_exe.yml
    secrets: inherit
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

  build_cli_linux:
    uses: ./.github/workflows/build_linux_cli.yml

  build_cli_windows_exe:
    uses: ./.github/workflows/build_windows_cli_exe.yml
    secrets: inherit
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

  release:
    needs:
      - build_apk
      - build_tar_x86_64
      - build_tar_arm_64
      - build_deb_x86_64
      - build_deb_arm_64
      - build_appimage_x86_64
      - build_appimage_arm_64
      - build_macos_dmg
      - build_windows_zip_x86_64
      - build_windows_zip_arm_64
      - build_windows_exe_x86_64
      - build_cli_linux
      - build_cli_windows_exe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: apk-result
          path: artifacts/apk-result

      - name: Download Linux tar.gz artifacts
        uses: actions/download-artifact@v7
        with:
          name: tar-gz-x86-64-result
          path: artifacts/tar-gz-x86-64-result

      - name: Download arm64 Linux tar.gz artifact
        uses: actions/download-artifact@v7
        with:
          name: tar-gz-arm-64-result
          path: artifacts/tar-gz-arm-64-result

      - name: Download deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: deb-x86-64-result
          path: artifacts/deb-x86-64-result

      - name: Download arm64 deb artifact
        uses: actions/download-artifact@v7
        with:
          name: deb-arm-64-result
          path: artifacts/deb-arm-64-result

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v7
        with:
          name: appimage-x86-64-result
          path: artifacts/appimage-x86-64-result

      - name: Download arm64 AppImage artifact
        uses: actions/download-artifact@v7
        with:
          name: appimage-arm-64-result
          path: artifacts/appimage-arm-64-result

      - name: Download macOS DMG artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-dmg-arm64-result
          path: artifacts/macos-dmg-arm64-result

      - name: Download x86_64 macOS DMG artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-dmg-x86_64-result
          path: artifacts/macos-dmg-x86_64-result

      - name: Download Windows zip artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-zip-x86-64-result
          path: artifacts/windows-zip-x86-64-result

      - name: Download arm64 Windows zip artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-zip-arm-64-result
          path: artifacts/windows-zip-arm-64-result

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-exe-x86-64-result
          path: artifacts/windows-exe-x86-64-result

      - name: Download Linux CLI artifacts
        uses: actions/download-artifact@v7
        with:
          name: cli-linux-x86-64-result
          path: artifacts/cli-linux-x86-64-result

      - name: Download arm64 Linux CLI artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-linux-arm-64-result
          path: artifacts/cli-linux-arm-64-result

      - name: Download Windows CLI artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-cli-exe-x86-64-result
          path: artifacts/windows-cli-exe-x86-64-result

      - name: Download arm64 Windows CLI artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-cli-exe-arm-64-result
          path: artifacts/windows-cli-exe-arm-64-result

      - name: Collect release assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p release-assets

          cp_first() {
            local src="$1" pattern="$2" dest="$3"
            local file
            file="$(find "${src}" -maxdepth 1 -type f -name "${pattern}" -print -quit)"
            if [ -z "${file}" ]; then
              echo "::error::no file matching ${pattern} found in ${src}"
              ls -la "${src}"
              exit 1
            fi
            cp -v "${file}" "${dest}"
          }

          cp -v artifacts/apk-result/app-armeabi-v7a-release.apk "release-assets/LightingSend-${VERSION}-android-arm32v7.apk"
          cp -v artifacts/apk-result/app-arm64-v8a-release.apk "release-assets/LightingSend-${VERSION}-android-arm64v8.apk"
          cp -v artifacts/apk-result/app-x86_64-release.apk "release-assets/LightingSend-${VERSION}-android-x64.apk"

          cp_first artifacts/tar-gz-x86-64-result '*.tar.gz' "release-assets/LightingSend-${VERSION}-linux-x86-64.tar.gz"
          cp_first artifacts/tar-gz-arm-64-result '*.tar.gz' "release-assets/LightingSend-${VERSION}-linux-arm-64.tar.gz"
          cp_first artifacts/deb-x86-64-result '*.deb' "release-assets/LightingSend-${VERSION}-linux-x86-64.deb"
          cp_first artifacts/deb-arm-64-result '*.deb' "release-assets/LightingSend-${VERSION}-linux-arm-64.deb"
          cp_first artifacts/appimage-x86-64-result '*.AppImage' "release-assets/LightingSend-${VERSION}-linux-x86-64.AppImage"
          cp_first artifacts/appimage-arm-64-result '*.AppImage' "release-assets/LightingSend-${VERSION}-linux-arm-64.AppImage"
          cp_first artifacts/macos-dmg-arm64-result '*.dmg' "release-assets/LightingSend-${VERSION}-macos-arm64.dmg"
          cp_first artifacts/macos-dmg-x86_64-result '*.dmg' "release-assets/LightingSend-${VERSION}-macos-x86_64.dmg"
          cp_first artifacts/windows-zip-x86-64-result '*.zip' "release-assets/LightingSend-${VERSION}-windows-x86-64.zip"
          cp_first artifacts/windows-zip-arm-64-result '*.zip' "release-assets/LightingSend-${VERSION}-windows-arm-64.zip"
          cp_first artifacts/windows-exe-x86-64-result '*.exe' "release-assets/LightingSend-${VERSION}-windows-x86-64.exe"
          cp_first artifacts/cli-linux-x86-64-result '*.tar.gz' "release-assets/LightingSend-CLI-${VERSION}-linux-x86-64.tar.gz"
          cp_first artifacts/cli-linux-arm-64-result '*.tar.gz' "release-assets/LightingSend-CLI-${VERSION}-linux-arm-64.tar.gz"
          cp_first artifacts/windows-cli-exe-x86-64-result '*.exe' "release-assets/LightingSend-CLI-${VERSION}-windows-x86-64.exe"
          cp_first artifacts/windows-cli-exe-arm-64-result '*.exe' "release-assets/LightingSend-CLI-${VERSION}-windows-arm-64.exe"

          find release-assets -maxdepth 1 -type f -print | sort

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          ASSET_COUNT="$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${ASSET_COUNT}" -lt 1 ]; then
            echo "::error::no release assets collected, refusing to checksum an empty set"
            exit 1
          fi
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum > ../checksums.txt
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r md5sum > ../checksums-md5.txt
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha1sum > ../checksums-sha1.txt
          for SUM in ../checksums.txt ../checksums-md5.txt ../checksums-sha1.txt; do
            if [ "$(wc -l < "${SUM}" | tr -d ' ')" -ne "${ASSET_COUNT}" ]; then
              echo "::error::${SUM} line count does not match the asset count"
              exit 1
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: LightingSend ${{ steps.get_version.outputs.version }}
          body: |
            LightingSend ${{ steps.get_version.outputs.version }} release.

            - Windows: NSIS/Inno Setup installer (`LightingSend-${{ steps.get_version.outputs.version }}-windows-x86-64.exe`)
            - macOS Intel: ad-hoc signed DMG (`LightingSend-${{ steps.get_version.outputs.version }}-macos-x86_64.dmg`)
            - macOS Apple Silicon: ad-hoc signed DMG (`LightingSend-${{ steps.get_version.outputs.version }}-macos-arm64.dmg`)
            - Linux: AppImage (`LightingSend-${{ steps.get_version.outputs.version }}-linux-x86-64.AppImage` / `LightingSend-${{ steps.get_version.outputs.version }}-linux-arm-64.AppImage`)
            - Android: APK (`arm32v7` / `arm64v8` / `x64`)

            Checksums for every asset are in `checksums.txt`, `checksums-md5.txt` and `checksums-sha1.txt`.
          files: |
            release-assets/*
            checksums.txt
            checksums-md5.txt
            checksums-sha1.txt
          fail_on_unmatched_files: true
