name: Build linux arm64 AppImage

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_appimage_arm_64:
    needs: build
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      # Flutter doesn't provide Linux ARM64 binaries, so clone the SDK from GitHub instead of using a setup action.
      - name: Setup Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter --version

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile linux
        working-directory: app
        run: flutter build linux

      # appimage-builder's Docker image only exists for amd64, so build the
      # AppImage natively for the architecture of this runner instead.
      - name: Build AppImage
        run: support/scripts/compile_linux_appimage_native.sh app/build/linux/arm64/release/bundle

      - name: Upload AppImage file
        uses: actions/upload-artifact@v6
        with:
          name: appimage-arm-64-result
          path: ./*.AppImage
