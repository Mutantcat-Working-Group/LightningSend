name: Build server

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_server_linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: x86-64
          - runner: ubuntu-22.04-arm
            suffix: arm-64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install # version from rust-toolchain.toml

      - name: Compile server
        run: cargo build --release --package server

      - name: Create tar.gz archive
        run: |
          tar -czvf "LightingSend-Server-${{ needs.build.outputs.version }}-linux-${{ matrix.suffix }}.tar.gz" -C target/release server

      - name: Upload server binary
        uses: actions/upload-artifact@v6
        with:
          name: server-linux-${{ matrix.suffix }}-result
          path: LightingSend-Server-${{ needs.build.outputs.version }}-linux-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  build_server_docker:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: x86-64
          - runner: ubuntu-22.04-arm
            suffix: arm-64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f server/Dockerfile -t lightingsend-server:${{ needs.build.outputs.version }} .

      - name: Save Docker image as tar.gz
        run: |
          docker save lightingsend-server:${{ needs.build.outputs.version }} | gzip -9 > "LightingSend-Server-${{ needs.build.outputs.version }}-docker-${{ matrix.suffix }}.tar.gz"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v6
        with:
          name: server-docker-${{ matrix.suffix }}-result
          path: LightingSend-Server-${{ needs.build.outputs.version }}-docker-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
